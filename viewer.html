<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자료 보기 · 스마트폰 활용 중급반</title>
<style>
  :root { color-scheme: light; --ink:#2F3C7E; --coral:#F96167; --coral-deep:#D8474D; --paper:#FFFEFC; --bg:#ECEAE6; --line:#E8E2DA; --muted:#565f8f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--paper);
    border-bottom: 1px solid var(--line); padding: 10px 12px calc(10px) 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .title { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; padding: 0 14px; border-radius: 10px; font-size: 15px; font-weight: 700; text-decoration: none; border: 2px solid var(--coral); background: var(--paper); color: var(--coral-deep); cursor: pointer; font-family: inherit; }
  .btn.solid { background: var(--coral); color: #fff; }
  .btn.small { min-width: 44px; padding: 0 10px; font-size: 20px; }
  .tools { margin-top: 8px; justify-content: space-between; }
  .zoom { display: flex; align-items: center; gap: 6px; }
  .pct { font-size: 14px; color: var(--muted); min-width: 48px; text-align: center; }
  #pages { padding: 12px 8px 40px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; overflow-x: auto; }
  canvas { display: block; margin: 0 auto; flex: none; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); border-radius: 4px; max-width: none; }
  .msg { margin: 40px auto; padding: 0 16px; text-align: center; font-size: 17px; line-height: 1.6; }
  .msg a { color: var(--coral-deep); font-weight: 700; }
  .pageno { font-size: 12px; color: var(--muted); margin: -6px auto 0; }
</style>
</head>
<body>
<header>
  <div class="row">
    <a class="btn" href="./">← 자료실</a>
    <div class="title" id="title">자료 보기</div>
  </div>
  <div class="row tools">
    <div class="zoom">
      <button class="btn small" id="zoomOut" aria-label="작게 보기">−</button>
      <span class="pct" id="pct">100%</span>
      <button class="btn small" id="zoomIn" aria-label="크게 보기">+</button>
    </div>
    <a class="btn solid" id="download" href="#" download>⬇ 저장하기</a>
  </div>
</header>

<main id="pages"><div class="msg" id="msg">자료를 불러오는 중입니다…<br>잠시만 기다려 주세요.</div></main>

<script type="module">
  const params = new URLSearchParams(location.search);
  const file = params.get("file") || "";
  const msg = document.getElementById("msg");
  const pagesEl = document.getElementById("pages");

  // 같은 폴더의 PDF 파일만 허용
  const safe = /^[^\/\\:?#]+\.pdf$/i.test(file);
  const url = "./" + encodeURIComponent(file);
  document.getElementById("title").textContent = file.replace(/\.pdf$/i, "").replace(/_/g, " ") || "자료 보기";
  const dl = document.getElementById("download");
  dl.href = url; dl.setAttribute("download", file);

  function fail() {
    msg.innerHTML = '자료를 화면에 띄우지 못했습니다.<br><a href="' + url + '">여기를 눌러 파일 열기</a> 또는 위의 <b>⬇ 저장하기</b>를 이용해 주세요.';
  }

  (async () => {
  if (!safe) {
    msg.innerHTML = '자료 이름이 올바르지 않습니다.<br><a href="./">자료실로 돌아가기</a>';
  } else {
    try {
      const pdfjs = await import("./pdf.min.js");
      pdfjs.GlobalWorkerOptions.workerSrc = "./pdf.worker.min.js";
      const doc = await pdfjs.getDocument({ url }).promise;

      let zoom = 1;
      const pct = document.getElementById("pct");
      let renderToken = 0;

      async function renderAll() {
        const token = ++renderToken;
        pagesEl.innerHTML = "";
        const avail = Math.min(pagesEl.clientWidth || window.innerWidth, 1100) - 16;
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        for (let i = 1; i <= doc.numPages; i++) {
          if (token !== renderToken) return;
          const page = await doc.getPage(i);
          const base = page.getViewport({ scale: 1 });
          const cssScale = (avail / base.width) * zoom;
          const vp = page.getViewport({ scale: cssScale * dpr });
          const canvas = document.createElement("canvas");
          canvas.width = Math.floor(vp.width);
          canvas.height = Math.floor(vp.height);
          canvas.style.width = Math.floor(vp.width / dpr) + "px";
          canvas.style.height = Math.floor(vp.height / dpr) + "px";
          canvas.setAttribute("aria-label", i + "쪽");
          pagesEl.appendChild(canvas);
          const no = document.createElement("div");
          no.className = "pageno"; no.textContent = i + " / " + doc.numPages;
          pagesEl.appendChild(no);
          await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        }
      }

      function setZoom(z) {
        zoom = Math.max(0.6, Math.min(3, Math.round(z * 10) / 10));
        pct.textContent = Math.round(zoom * 100) + "%";
        renderAll();
      }
      document.getElementById("zoomIn").onclick = () => setZoom(zoom + 0.25);
      document.getElementById("zoomOut").onclick = () => setZoom(zoom - 0.25);

      let lastW = window.innerWidth;
      window.addEventListener("resize", () => {
        if (Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; renderAll(); }
      });

      await renderAll();
    } catch (e) {
      console.error(e);
      fail();
    }
  }
  })();
</script>
</body>
</html>
